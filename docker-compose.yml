volumes:
  db_data:
    driver: local
  lfcr_data: {}

networks:
  lfcr-network:
    driver: bridge

services:
  # FeeCollector Reporter API service
  lfcr-api:
    container_name: fees-reporter-api
    build:
      context: .
      dockerfile: ./Dockerfile
      target: lfcr-server-prod
      args:
        - DOCKER_IMG_NAME=fees-reporter-api
        - DOCKER_IMG_TAG=latest
        - API_PORT=3000
        - PROJECT_PACKAGE=@jabba01/lfcr-fees-reporter-api
        - PROJECT_PATH=packages/fees-reporter-api
    image: fees-reporter-api
    depends_on:
      - lfcr-db
    ports:
      - 3000:3000
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      MONGODB_HOST: lfcr-db
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      CHAIN_SCAN_BLOCKS_BATCH_SIZE: ${CHAIN_SCAN_BLOCKS_BATCH_SIZE}
      CHAIN_LATEST_BLOCK_TAG: ${CHAIN_LATEST_BLOCK_TAG}
      CHAIN_QUERY_FAIL_RETRY_NB: ${CHAIN_QUERY_FAIL_RETRY_NB}
      CHAIN_POLYGON_RPC_URL: ${CHAIN_POLYGON_RPC_URL}
      CHAIN_POLYGON_FEE_COLLECTOR_CONTRACT: ${CHAIN_POLYGON_FEE_COLLECTOR_CONTRACT}
      CHAIN_POLYGON_FEE_COLLECTOR_BLOCK_START: ${CHAIN_POLYGON_FEE_COLLECTOR_BLOCK_START}
    links:
      - lfcr-db
    volumes:
      - lfcr_data:/lfcr/data:rw
    networks:
      - lfcr-network

  # Database
  lfcr-db:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=test
    command: mongod --setParameter maxTransactionLockRequestTimeoutMillis=5000 --setParameter maxTransactionLockRequestTimeoutMillis=5000 --wiredTigerCacheSizeGB=1
    entrypoint: bash -c "docker-entrypoint.sh mongod | jq --unbuffered -r '.msg'"
    volumes:
      - db_data:/lfcr/db:rw
    networks:
      - lfcr-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s